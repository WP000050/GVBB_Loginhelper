<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#2f4f8f">

    <title>GVB Booischot Loginhelper</title>

    <!-- Correcte en vaste versie van html5-qrcode -->
    <script
        src="https://unpkg.com/html5-qrcode@2.3.8/html5cript>

    <style>
        :root {
            --blue: #2f4f8f;
            --blue-dark: #223b6d;
            --green: #a9b35c;
            --background: #eef3f8;
            --card: #ffffff;
            --line: #dfe7f2;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            background: var(--background);
            color: #1f2937;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(47, 79, 143, 0.35);
            outline-offset: 2px;
        }

        /* HOOFDCONTAINER */

        .container {
            width: min(1120px, 100%);
            min-height: calc(100vh - 20px);
            margin: 0 auto;
            padding: 12px 16px 14px;
            overflow: hidden;
            background: var(--card);
            border-top: 6px solid var(--blue);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(35, 55, 105, 0.14);
        }

        /* HEADER */

        .header {
            display: grid;
            grid-template-columns: 82px 1fr 82px;
            align-items: center;
            min-height: 58px;
            margin-bottom: 8px;
        }

        .logo {
            display: block;
            width: 74px;
            max-height: 56px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            color: var(--blue);
            text-align: center;
            font-size: clamp(27px, 3vw, 35px);
            line-height: 1.1;
        }

        /* INVOER EN SCANKNOP */

        .scan-section {
            max-width: 780px;
            margin: 0 auto 12px;
        }

        .inputblok {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 9px;
            padding: 9px;
            background: #f3f6ec;
            border: 2px solid var(--green);
            border-radius: 13px;
        }

        #snummer {
            width: 100%;
            min-width: 0;
            height: 44px;
            padding: 0 13px;
            background: #ffffff;
            border: 2px solid var(--green);
            border-radius: 9px;
            font-size: 18px;
        }

        .button {
            border: 0;
            border-radius: 9px;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }

        .button:hover {
            filter: brightness(0.95);
        }

        .button:active {
            transform: scale(0.98);
        }

        .scanbtn {
            min-width: 146px;
            height: 44px;
            padding: 0 14px;
            background: var(--green);
            font-size: 15px;
        }

        /* ONDERSTE BLOKKEN */

        .content-grid {
            display: grid;
            grid-template-columns: 0.88fr 1.12fr;
            gap: 13px;
            align-items: start;
        }

        .card {
            min-width: 0;
            padding: 13px;
            background: #f8fafc;
            border: 1px solid var(--line);
            border-radius: 13px;
            box-shadow: 0 3px 10px rgba(35, 55, 105, 0.08);
        }

        .card h2 {
            margin: 0 0 9px;
            color: var(--blue);
            text-align: center;
            font-size: 20px;
        }

        /* MICROSOFT 365 */

        .office-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .office-grid .button {
            min-height: 46px;
            padding: 8px 10px;
            font-size: 16px;
        }

        .office-grid .teams {
            grid-column: 1 / -1;
        }

        .teams {
            background: #6264a7;
        }

        .word {
            background: #2b579a;
        }

        .ppt {
            background: #d24726;
        }

        .onedrive {
            background: #0078d4;
        }

        .outlook {
            background: #0072c6;
        }

        /* TOOLBOXEN L1 TOT L6 */

        .toolbox-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .toolbox-grid .button {
            min-height: 46px;
            padding: 8px 10px;
            font-size: 16px;
        }

        .l1 {
            background: #4caf50;
        }

        .l2 {
            background: #8bc34a;
        }

        .l3 {
            background: #ffc107;
            color: #17202a;
        }

        .l4 {
            background: #ff7043;
        }

        .l5 {
            background: #9c27b0;
        }

        .l6 {
            background: #3f51b5;
        }

        /* VIJF NIEUWE AFBEELDINGSKNOPPEN */

        .image-tools {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
            margin-top: 9px;
        }

        .image-tool {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 66px;
            aspect-ratio: 1.2 / 1;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
            border: 2px solid #d8e2ee;
            border-radius: 10px;
            box-shadow: 0 2px 7px rgba(35, 55, 105, 0.1);
            cursor: pointer;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease;
        }

        .image-tool:hover {
            border-color: var(--blue);
            transform: translateY(-1px);
        }

        .image-tool:active {
            transform: scale(0.98);
        }

        .image-tool img {
            display: block;
            width: 100%;
            height: 100%;
            padding: 3px;
            object-fit: contain;
        }

        /* SCANNERPOPUP */

        .scanner-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: max(12px, 2vh) 12px 12px;
            background: rgba(15, 23, 42, 0.74);
        }

        .scanner-modal.open {
            display: flex;
        }

        .scanner-panel {
            width: min(540px, 96vw);
            max-height: 96vh;
            padding: 11px;
            overflow: auto;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 14px 42px rgba(0, 0, 0, 0.35);
        }

        .scanner-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .scanner-header h2 {
            margin: 0;
            color: var(--blue);
            font-size: 20px;
        }

        .closebtn {
            min-width: 92px;
            padding: 9px 12px;
            background: var(--blue);
        }

        #reader {
            width: 100%;
            min-height: 310px;
            overflow: hidden;
            background: #e9eef5;
            border-radius: 11px;
        }

        #reader video {
            object-fit: cover !important;
        }

        .scan-help {
            margin: 8px 4px 1px;
            color: #4b5563;
            text-align: center;
            font-size: 14px;
        }

        /* KLEINERE SCHERMEN */

        @media (max-width: 700px) {
            body {
                padding: 7px;
            }

            .container {
                min-height: calc(100vh - 14px);
                padding: 9px;
            }

            .header {
                grid-template-columns: 62px 1fr 62px;
                min-height: 52px;
            }

            .logo {
                width: 58px;
                max-height: 48px;
            }

            h1 {
                font-size: 24px;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .inputblok {
                grid-template-columns: 1fr;
            }

            .scanbtn {
                width: 100%;
            }

            .image-tools {
                grid-template-columns: repeat(5, minmax(52px, 1fr));
                overflow-x: auto;
            }
        }

        /* OPTIMALISATIE VOOR 11-INCH CHROMEBOOKS */

        @media (min-width: 701px) and (max-height: 720px) {
            body {
                padding: 7px;
            }

            .container {
                min-height: calc(100vh - 14px);
                padding: 9px 13px 11px;
            }

            .header {
                min-height: 48px;
                margin-bottom: 6px;
            }

            .logo {
                width: 64px;
                max-height: 46px;
            }

            h1 {
                font-size: 28px;
            }

            .scan-section {
                margin-bottom: 9px;
            }

            .inputblok {
                padding: 7px;
            }

            #snummer,
            .scanbtn {
                height: 40px;
            }

            .card {
                padding: 10px;
            }

            .card h2 {
                margin-bottom: 7px;
                font-size: 18px;
            }

            .office-grid .button,
            .toolbox-grid .button {
                min-height: 40px;
                padding: 6px 7px;
            }

            .image-tools {
                margin-top: 7px;
            }

            .image-tool {
                min-height: 56px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">

            png"
                alt="Logo GVB Booischot"
            >

            <h1>🎓 Loginhelper</h1>

            <span aria-hidden="true"></span>

        </header>

        <section
            class="scan-section"
            aria-label="Aanmelden"
        >

            <div class="inputblok">

                <input
                    id="snummer"
                    type="text"
                    inputmode="text"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="Typ S-nummer of scan QR-code"
                    aria-label="S-nummer of leerlingenaccount"
                >

                <button
                    class="button scanbtn"
                    type="button"
                    onclick="startScan()"
                >
                    📷 Scan QR-code
                </button>

            </div>

        </section>

        <section class="content-grid">

            <!-- MICROSOFT 365 -->

            <div class="card">

                <h2>Microsoft 365</h2>

                <div class="office-grid">

                    <button
                        class="button teams"
                        type="button"
                        onclick="openApp('teams')"
                    >
                        Teams
                    </button>

                    <button
                        class="button word"
                        type="button"
                        onclick="openApp('word')"
                    >
                        Word
                    </button>

                    <button
                        class="button ppt"
                        type="button"
                        onclick="openApp('ppt')"
                    >
                        PowerPoint
                    </button>

                    <button
                        class="button onedrive"
                        type="button"
                        onclick="openApp('onedrive')"
                    >
                        OneDrive
                    </button>

                    <button
                        class="button outlook"
                        type="button"
                        onclick="openApp('outlook')"
                    >
                        Outlook
                    </button>

                </div>

            </div>

            <!-- TOOLBOXEN -->

            <div class="card">

                <h2>Toolboxen</h2>

                <div class="toolbox-grid">

                    <button
                        class="button l1"
                        type="button"
                        onclick="openToolbox('l1')"
                    >
                        L1
                    </button>

                    <button
                        class="button l2"
                        type="button"
                        onclick="openToolbox('l2')"
                    >
                        L2
                    </button>

                    <button
                        class="button l3"
                        type="button"
                        onclick="openToolbox('l3')"
                    >
                        L3
                    </button>

                    <button
                        class="button l4"
                        type="button"
                        onclick="openToolbox('l4')"
                    >
                        L4
                    </button>

                    <button
                        class="button l5"
                        type="button"
                        onclick="openToolbox('l5')"
                    >
                        L5
                    </button>

                    <button
                        class="button l6"
                        type="button"
                        onclick="openToolbox('l6')"
                    >
                        L6
                    </button>

                </div>

                <!-- NIEUWE KNOPPEN ZONDER ZICHTBARE TEKST -->

                <div
                    class="image-tools"
                    aria-label="Extra toolboxen"
                >

                    <button
                        class="image-tool"
                        type="button"
                        onclick="openImageTool('bloem')"
                        aria-label="Open bloem"
                    >
                        bloem.png
                    </button>

                    <button
                        class="image-tool"
                        type="button"
                        onclick="openImageTool('jip')"
                        aria-label="Open Jip"
                    >
                        jip.png
                    </button>

                    <button
                        class="image-tool"
                        type="button"
                        onclick="openImageTool('jules')"
                        aria-label="Open Jules"
                    >
                        jules.png
                    </button>

                    <button
                        class="image-tool"
                        type="button"
                        onclick="openImageTool('kikker')"
                        aria-label="Open kikker"
                    >
                        kikker.png
                    </button>

                    <button
                        class="image-tool"
                        type="button"
                        onclick="openImageTool('vlinder')"
                        aria-label="Open vlinder"
                    >
                        vlinder.png
                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- SCANNERPOPUP -->

    <div
        id="scannerModal"
        class="scanner-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="scannerTitle"
    >

        <div class="scanner-panel">

            <div class="scanner-header">

                <h2 id="scannerTitle">
                    Scan de QR-code
                </h2>

                <button
                    class="button closebtn"
                    type="button"
                    onclick="closeScanner()"
                >
                    ✕ Sluiten
                </button>

            </div>

            <div id="reader"></div>

            <p class="scan-help">
                Houd de QR-code rustig voor de camera.
            </p>

        </div>

    </div>

    <script>
        "use strict";

        const SCHOOL_DOMAIN = "leerling.gvbbooischot.be";

        let scanner = null;
        let scannerIsRunning = false;
        let scannerIsStarting = false;

        /* LINKS VOOR L1 TOT L6 */

        const toolboxLinks = {
            l1: "https://gvbb.my.canva.site/1e-leerjaar/links",
            l2: "https://gvbb.my.canva.site/2e-leerjaar/links",
            l3: "https://gvbb.my.canva.site/3e-leerjaar/links",
            l4: "https://gvbb.my.canva.site/4e-leerjaar/links",
            l5: "https://gvbb.my.canva.site/5e-leerjaar/links",
            l6: "https://gvbb.my.canva.site/6e-leerjaar/links"
        };

        /*
         * Vul hieronder de vijf bestemmingslinks in.
         * Laat de namen bloem, jip, jules, kikker en vlinder staan.
         */

        const imageToolLinks = {
            bloem: "",
            jip: "",
            jules: "",
            kikker: "",
            vlinder: ""
        };

        /* PAGINA STARTEN */

        window.addEventListener("load", function () {
            const input = document.getElementById("snummer");

            if (input) {
                input.focus();
            }
        });

        /* ENTER OPENT TEAMS */

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeScanner();
                return;
            }

            if (
                event.key === "Enter" &&
                document.activeElement &&
                document.activeElement.id === "snummer"
            ) {
                openApp("teams");
            }
        });

        /* KLIK NAAST POPUP SLUIT DE SCANNER */

        document
            .getElementById("scannerModal")
            .addEventListener("click", function (event) {
                if (event.target.id === "scannerModal") {
                    closeScanner();
                }
            });

        /* QR-SCANNER STARTEN */

        async function startScan() {
            if (scannerIsStarting || scannerIsRunning) {
                return;
            }

            if (typeof Html5Qrcode === "undefined") {
                alert(
                    "❌ De QR-scanner kon niet worden geladen. " +
                    "Controleer de internetverbinding."
                );

                return;
            }

            const modal = document.getElementById("scannerModal");

            modal.classList.add("open");
            document.body.style.overflow = "hidden";

            scannerIsStarting = true;

            try {
                scanner = new Html5Qrcode("reader");

                await scanner.start(
                    {
                        facingMode: "environment"
                    },
                    {
                        fps: 10,

                        qrbox: function (viewWidth, viewHeight) {
                            const smallestSide = Math.min(
                                viewWidth,
                                viewHeight
                            );

                            const size = Math.floor(
                                smallestSide * 0.72
                            );

                            return {
                                width: size,
                                height: size
                            };
                        },

                        aspectRatio: 4 / 3
                    },

                    async function (decodedText) {
                        await closeScanner();
                        handleQR(decodedText);
                    },

                    function () {
                        /*
                         * Geen foutmelding nodig wanneer een camerabeeld
                         * tijdelijk geen QR-code bevat.
                         */
                    }
                );

                scannerIsRunning = true;
            } catch (error) {
                scannerIsRunning = false;
                scanner = null;

                modal.classList.remove("open");
                document.body.style.overflow = "";

                alert(
                    "❌ De camera kon niet worden gestart. " +
                    "Open de website via HTTPS en geef cameratoegang."
                );
            } finally {
                scannerIsStarting = false;
            }
        }

        /* QR-SCANNER CORRECT STOPPEN */

        async function closeScanner() {
            const modal = document.getElementById("scannerModal");

            if (scanner && scannerIsRunning) {
                try {
                    await scanner.stop();
                } catch (error) {
                    console.warn(
                        "Scanner kon niet volledig worden gestopt.",
                        error
                    );
                }
            }

            if (scanner) {
                try {
                    scanner.clear();
                } catch (error) {
                    console.warn(
                        "Scannerweergave kon niet worden leeggemaakt.",
                        error
                    );
                }
            }

            scanner = null;
            scannerIsRunning = false;
            scannerIsStarting = false;

            modal.classList.remove("open");
            document.body.style.overflow = "";
        }

        /* LEERLINGENACCOUNT NORMALISEREN */

        function normalizeUser(value) {
            let user = String(value || "")
                .trim()
                .replace(/\s/g, "")
                .toLowerCase();

            /*
             * 123456
             * wordt:
             * s123456@leerling.gvbbooischot.be
             */

            if (/^[0-9]{6}$/.test(user)) {
                user =
                    "s" +
                    user +
                    "@" +
                    SCHOOL_DOMAIN;
            }

            /*
             * s123456
             * wordt:
             * s123456@leerling.gvbbooischot.be
             */

            if (/^s[0-9]{6}$/.test(user)) {
                user =
                    user +
                    "@" +
                    SCHOOL_DOMAIN;
            }

            /*
             * 123456@leerling.gvbbooischot.be
             * wordt:
             * s123456@leerling.gvbbooischot.be
             */

            if (
                /^[0-9]{6}@leerling\.gvbbooischot\.be$/.test(user)
            ) {
                user = "s" + user;
            }

            return user;
        }

        /* CONTROLEREN OF HET ACCOUNT GELDIG IS */

        function isValidUser(user) {
            return /^s[0-9]{6}@leerling\.gvbbooischot\.be$/.test(
                user
            );
        }

        /* QR-CODE VERWERKEN */

        function handleQR(data) {
            const raw = String(data || "").trim();

            let user = raw;

            if (raw.toLowerCase().includes("login_hint=")) {
                try {
                    const scannedUrl = new URL(raw);

                    user =
                        scannedUrl.searchParams.get("login_hint") ||
                        "";
                } catch (error) {
                    const match = raw.match(
                        /[?&]login_hint=([^&]+)/i
                    );

                    user = match
                        ? decodeURIComponent(match[1])
                        : "";
                }
            }

            user = normalizeUser(user);

            const input = document.getElementById("snummer");
            input.value = user;

            if (!isValidUser(user)) {
                alert("❌ QR-code niet herkend.");

                input.focus();
                input.select();

                return;
            }

            goToTeams(user);
        }

        /* ACCOUNT UIT HET INVOERVELD HALEN */

        function getUserFromInput() {
            const input = document.getElementById("snummer");

            if (!input.value.trim()) {
                alert(
                    "⚠️ Typ een S-nummer of scan een QR-code."
                );

                input.focus();

                return null;
            }

            const user = normalizeUser(input.value);

            if (!isValidUser(user)) {
                alert(
                    "⚠️ Ongeldig S-nummer. Gebruik S gevolgd door " +
                    "6 cijfers, of alleen de 6 cijfers."
                );

                input.focus();
                input.select();

                return null;
            }

            input.value = user;

            return user;
        }

        /* TEAMS OPENEN */

        function goToTeams(user) {
            const url =
                "https://teams.microsoft.com/?login_hint=" +
                encodeURIComponent(user);

            window.location.href = url;
        }

        /* MICROSOFT-APPLICATIES OPENEN */

        function openApp(app) {
            const user = getUserFromInput();

            if (!user) {
                return;
            }

            const loginHint = encodeURIComponent(user);

            const appLinks = {
                teams:
                    "https://teams.microsoft.com/?login_hint=" +
                    loginHint,

                word:
                    "https://www.office.com/launch/word" +
                    "?auth=2&login_hint=" +
                    loginHint,

                ppt:
                    "https://www.office.com/launch/powerpoint" +
                    "?auth=2&login_hint=" +
                    loginHint,

                onedrive:
                    "https://www.office.com/launch/onedrive" +
                    "?auth=2&login_hint=" +
                    loginHint,

                outlook:
                    "https://outlook.office.com/mail/" +
                    "?login_hint=" +
                    loginHint
            };

            if (!appLinks[app]) {
                alert("De gekozen Microsoft-toepassing bestaat niet.");
                return;
            }

            window.location.href = appLinks[app];
        }

        /* TOOLBOXEN L1 TOT L6 OPENEN */

        function openToolbox(key) {
            const url = toolboxLinks[key];

            if (!url) {
                alert("Voor deze toolbox werd geen link ingesteld.");
                return;
            }

            window.location.href = url;
        }

        /* NIEUWE AFBEELDINGSKNOPPEN OPENEN */

        function openImageTool(key) {
            const url = imageToolLinks[key];

            if (!url) {
                alert(
                    "Deze knop heeft nog geen link. " +
                    "Vul de bestemming in bij imageToolLinks " +
                    "in index.html."
                );

                return;
            }

            window.location.href = url;
        }
    </script>

</body>
</html>
