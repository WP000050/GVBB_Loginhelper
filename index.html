<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GVB Booischot Loginhelper</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef3f8;
            color: #26354f;
        }

        button,
        input {
            font-family: inherit;
        }

        /* HOOFDCONTAINER */

        .container {
            position: relative;
            width: 100%;
            max-width: 1050px;
            min-height: calc(100vh - 24px);
            margin: 0 auto;
            padding: 18px;
            overflow: hidden;

            background: #ffffff;
            border-top: 7px solid #2f4f8f;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(35, 55, 105, 0.16);
        }

        /* BOVENBALK */

        .header {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 115px;
            margin-bottom: 12px;
        }

        .logo {
            position: absolute;
            top: 13px;
            left: 18px;
            width: 88px;
            height: auto;
            max-height: 72px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            color: #2f4f8f;
            text-align: center;
            font-size: clamp(27px, 4vw, 36px);
            line-height: 1.1;
        }

        /* LOGIN EN SCANNER */

        .login-panel {
            width: 100%;
            max-width: 740px;
            margin: 0 auto 16px;
            padding: 12px;

            background: #f3f6ec;
            border: 2px solid #a9b35c;
            border-radius: 15px;
        }

        .login-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: stretch;
        }

        #snummer {
            width: 100%;
            min-width: 0;
            padding: 12px 14px;

            font-size: 18px;
            border: 2px solid #a9b35c;
            border-radius: 11px;
            outline: none;
        }

        #snummer:focus {
            border-color: #7f8e35;
            box-shadow: 0 0 0 3px rgba(169, 179, 92, 0.22);
        }

        .scanbtn {
            min-width: 145px;
            padding: 10px 14px;

            color: #ffffff;
            background: #87933d;
            border: none;
            border-radius: 11px;

            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .scanbtn:hover {
            background: #74802f;
        }

        .scanbtn:active {
            transform: scale(0.98);
        }

        /* HOOFDINDELING */

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.35fr);
            gap: 14px;
            align-items: stretch;
        }

        .card {
            min-width: 0;
            padding: 14px;

            background: #f8fafc;
            border: 1px solid #dfe7f2;
            border-radius: 15px;
            box-shadow: 0 4px 12px rgba(35, 55, 105, 0.10);
        }

        .card h2 {
            margin: 0 0 11px;
            color: #2f4f8f;
            text-align: center;
            font-size: 21px;
        }

        /* ALGEMENE KNOPPEN */

        .button {
            width: 100%;
            min-height: 43px;
            margin-top: 7px;
            padding: 9px 12px;

            color: #ffffff;
            border: none;
            border-radius: 10px;

            font-size: 15px;
            font-weight: 700;
            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                box-shadow 0.15s ease;
        }

        .button:hover {
            opacity: 0.93;
            transform: translateY(-1px);
            box-shadow: 0 4px 9px rgba(35, 55, 105, 0.14);
        }

        .button:active {
            transform: scale(0.98);
        }

        /* MICROSOFT 365 */

        .microsoft-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 7px;
        }

        .microsoft-grid .button {
            margin: 0;
        }

        .teams {
            background: #6264a7;
        }

        .word {
            background: #2b579a;
        }

        .ppt {
            background: #d24726;
        }

        .onedrive {
            background: #0078d4;
        }

        .outlook {
            background: #0072c6;
        }

        /* TOOLBOXEN L1 TOT EN MET L6 */

        .toolbox-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .toolbox-grid .button {
            margin: 0;
        }

        .l1 {
            background: #4caf50;
        }

        .l2 {
            background: #8bc34a;
        }

        .l3 {
            color: #263238;
            background: #ffc107;
        }

        .l4 {
            background: #ff7043;
        }

        .l5 {
            background: #9c27b0;
        }

        .l6 {
            background: #3f51b5;
        }

        /* NIEUWE AFBEELDINGSKNOPPEN */

        .image-buttons-title {
            margin: 13px 0 8px;
            color: #56657d;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
        }

        .image-button-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .image-button {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 0;
            overflow: hidden;

            background: #ffffff;
            border: 2px solid #e1e8f1;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(35, 55, 105, 0.10);

            cursor: pointer;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .image-button:hover {
            border-color: #a9b35c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(35, 55, 105, 0.16);
        }

        .image-button:focus-visible {
            outline: 3px solid #2f4f8f;
            outline-offset: 2px;
        }

        .image-button img {
            display: block;
            width: 100%;
            height: 100%;
            padding: 3px;
            object-fit: contain;
            background: #ffffff;
        }

        /* SCANNER POP-UP */

        .scanner-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: none;
            align-items: flex-start;
            justify-content: center;

            padding: 4vh 12px 12px;
            background: rgba(16, 28, 48, 0.72);
            backdrop-filter: blur(3px);
        }

        .scanner-overlay.open {
            display: flex;
        }

        .scanner-popup {
            width: min(92vw, 480px);
            max-height: 92vh;
            padding: 14px;
            overflow: auto;

            background: #ffffff;
            border-top: 6px solid #a9b35c;
            border-radius: 16px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.30);
        }

        .scanner-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .scanner-header h2 {
            margin: 0;
            color: #2f4f8f;
            font-size: 20px;
        }

        .close-scanner {
            width: 38px;
            height: 38px;
            flex-shrink: 0;

            color: #ffffff;
            background: #c43b35;
            border: none;
            border-radius: 50%;

            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .scanner-help {
            margin: 0 0 10px;
            color: #58677c;
            text-align: center;
            font-size: 14px;
        }

        #reader {
            width: 100%;
            min-height: 250px;
            overflow: hidden;

            background: #edf2f7;
            border-radius: 12px;
        }

        #reader video {
            width: 100% !important;
            max-height: 58vh;
            object-fit: cover;
        }

        .scanner-status {
            min-height: 20px;
            margin-top: 9px;
            color: #56657d;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        /* 11-INCH CHROMEBOOK */

        @media (max-width: 1200px) and (max-height: 800px) {
            body {
                padding: 8px;
            }

            .container {
                min-height: calc(100vh - 16px);
                padding: 13px;
                border-radius: 14px;
            }

            .header {
                min-height: 55px;
                margin-bottom: 8px;
            }

            .logo {
                top: 10px;
                left: 14px;
                width: 72px;
                max-height: 58px;
            }

            h1 {
                font-size: 29px;
            }

            .login-panel {
                margin-bottom: 10px;
                padding: 9px;
            }

            #snummer {
                padding: 9px 12px;
                font-size: 16px;
            }

            .scanbtn {
                min-width: 132px;
                padding: 8px 11px;
                font-size: 14px;
            }

            .content-grid {
                gap: 10px;
            }

            .card {
                padding: 11px;
            }

            .card h2 {
                margin-bottom: 8px;
                font-size: 18px;
            }

            .button {
                min-height: 37px;
                padding: 7px 9px;
                font-size: 14px;
            }

            .image-buttons-title {
                margin: 9px 0 6px;
                font-size: 13px;
            }

            .image-button-grid {
                gap: 6px;
            }

            .image-button {
                border-radius: 9px;
            }

            .scanner-overlay {
                padding-top: 2vh;
            }
        }

        /* SMALLERE SCHERMEN */

        @media (max-width: 760px) {
            .container {
                padding: 12px;
            }

            .header {
                min-height: 100px;
                padding: 68px 0 0;
            }

            .logo {
                left: 50%;
                width: 74px;
                transform: translateX(-50%);
            }

            .login-row {
                grid-template-columns: 1fr;
            }

            .scanbtn {
                width: 100%;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .toolbox-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .image-button-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 460px) {
            body {
                padding: 0;
            }

            .container {
                min-height: 100vh;
                border-radius: 0;
            }

            .toolbox-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-button-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        png"
            alt="GVB Booischot logo"
        >

        <h1>🎓 Loginhelper</h1>
    </header>

    <section class="login-panel">
        <div class="login-row">

            <input
                id="snummer"
                type="text"
                inputmode="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                placeholder="Typ S-nummer of scan QR-code"
                aria-label="S-nummer"
            >

            <button
                class="scanbtn"
                type="button"
                onclick="startScan()"
            >
                📷 QR scannen
            </button>

        </div>
    </section>

    <main class="content-grid">

        <!-- MICROSOFT 365 -->

        <section class="card">
            <h2>Microsoft 365</h2>

            <div class="microsoft-grid">

                <button
                    class="button teams"
                    type="button"
                    onclick="openApp('teams')"
                >
                    Teams
                </button>

                <button
                    class="button word"
                    type="button"
                    onclick="openApp('word')"
                >
                    Word
                </button>

                <button
                    class="button ppt"
                    type="button"
                    onclick="openApp('ppt')"
                >
                    PowerPoint
                </button>

                <button
                    class="button onedrive"
                    type="button"
                    onclick="openApp('onedrive')"
                >
                    OneDrive
                </button>

                <button
                    class="button outlook"
                    type="button"
                    onclick="openApp('outlook')"
                >
                    Outlook
                </button>

            </div>
        </section>

        <!-- TOOLBOXEN -->

        <section class="card">
            <h2>Toolboxen</h2>

            <div class="toolbox-grid">

                <button
                    class="button l1"
                    type="button"
                    onclick="openToolbox('l1')"
                >
                    L1
                </button>

                <button
                    class="button l2"
                    type="button"
                    onclick="openToolbox('l2')"
                >
                    L2
                </button>

                <button
                    class="button l3"
                    type="button"
                    onclick="openToolbox('l3')"
                >
                    L3
                </button>

                <button
                    class="button l4"
                    type="button"
                    onclick="openToolbox('l4')"
                >
                    L4
                </button>

                <button
                    class="button l5"
                    type="button"
                    onclick="openToolbox('l5')"
                >
                    L5
                </button>

                <button
                    class="button l6"
                    type="button"
                    onclick="openToolbox('l6')"
                >
                    L6
                </button>

            </div>

            <div class="image-buttons-title">
                Kleutertoolboxen
            </div>

            <div class="image-button-grid">

                <button
                    class="image-button"
                    type="button"
                    onclick="openPictureToolbox('bloem')"
                    aria-label="Toolbox Bloem"
                    title="Toolbox Bloem"
                >
                    https://raw.githubusercontent.com/WP000050/GVBB_Loginhelper/main/bloem.png
                </button>

                <button
                    class="image-button"
                    type="button"
                    onclick="openPictureToolbox('jip')"
                    aria-label="Toolbox Jip"
                    title="Toolbox Jip"
                >
                    https://raw.githubusercontent.com/WP000050/GVBB_Loginhelper/main/jip.png
                </button>

                <button
                    class="image-button"
                    type="button"
                    onclick="openPictureToolbox('jules')"
                    aria-label="Toolbox Jules"
                    title="Toolbox Jules"
                >
                    https://raw.githubusercontent.com/WP000050/GVBB_Loginhelper/main/jules.png
                </button>

                <button
                    class="image-button"
                    type="button"
                    onclick="openPictureToolbox('kikker')"
                    aria-label="Toolbox Kikker"
                    title="Toolbox Kikker"
                >
                    https://raw.githubusercontent.com/WP000050/GVBB_Loginhelper/main/kikker.png
                </button>

                <button
                    class="image-button"
                    type="button"
                    onclick="openPictureToolbox('vlinder')"
                    aria-label="Toolbox Vlinder"
                    title="Toolbox Vlinder"
                >
                    https://raw.githubusercontent.com/WP000050/GVBB_Loginhelper/main/vlinder.png
                </button>

            </div>
        </section>

    </main>
</div>

<!-- SCANNER POP-UP -->

<div
    id="scannerOverlay"
    class="scanner-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="scannerTitle"
    onclick="overlayClick(event)"
>
    <div class="scanner-popup">

        <div class="scanner-header">

            <h2 id="scannerTitle">Scan de QR-code</h2>

            <button
                class="close-scanner"
                type="button"
                onclick="closeScanner()"
                aria-label="Scanner sluiten"
                title="Scanner sluiten"
            >
                ×
            </button>

        </div>

        <p class="scanner-help">
            Houd de QR-code voor de camera.
        </p>

        <div id="reader"></div>

        <div
            id="scannerStatus"
            class="scanner-status"
            aria-live="polite"
        ></div>

    </div>
</div>

<script>
    let scanner = null;
    let scannerRunning = false;

    const leerlingDomein = "leerling.gvbbooischot.be";

    window.addEventListener("load", function () {
        document.getElementById("snummer").focus();
    });

    document
        .getElementById("snummer")
        .addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                openApp("teams");
            }
        });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeScanner();
        }
    });

    /* QR-SCANNER */

    async function startScan() {
        const overlay = document.getElementById("scannerOverlay");
        const status = document.getElementById("scannerStatus");
        const reader = document.getElementById("reader");

        overlay.classList.add("open");
        document.body.style.overflow = "hidden";

        status.textContent = "Camera starten...";
        reader.innerHTML = "";

        if (scannerRunning && scanner) {
            try {
                await scanner.stop();
            } catch (error) {
                console.log(error);
            }

            scannerRunning = false;
        }

        scanner = new Html5Qrcode("reader");

        const scannerConfig = {
            fps: 12,
            qrbox: function (viewfinderWidth, viewfinderHeight) {
                const minimumSize = Math.min(
                    viewfinderWidth,
                    viewfinderHeight
                );

                const size = Math.floor(
                    Math.min(minimumSize * 0.72, 270)
                );

                return {
                    width: size,
                    height: size
                };
            },
            aspectRatio: 1
        };

        try {
            await scanner.start(
                {
                    facingMode: {
                        ideal: "environment"
                    }
                },
                scannerConfig,
                onScanSuccess,
                function () {
                    /* Scanpogingen zonder resultaat niet tonen. */
                }
            );

            scannerRunning = true;
            status.textContent = "Houd de QR-code binnen het kader.";
        } catch (error) {
            scannerRunning = false;

            status.textContent =
                "De camera kon niet worden gestart.";

            alert(
                "De camera kon niet worden gestart. Controleer de cameratoestemming en gebruik de website via HTTPS."
            );
        }
    }

    async function onScanSuccess(decodedText) {
        if (!scannerRunning) {
            return;
        }

        document.getElementById("scannerStatus").textContent =
            "QR-code gevonden...";

        await stopScanner();
        closeScannerWindow();

        handleQR(decodedText);
    }

    async function stopScanner() {
        if (scanner && scannerRunning) {
            try {
                await scanner.stop();
            } catch (error) {
                console.log(error);
            }
        }

        scannerRunning = false;

        const reader = document.getElementById("reader");

        if (reader) {
            reader.innerHTML = "";
        }
    }

    async function closeScanner() {
        await stopScanner();
        closeScannerWindow();
    }

    function closeScannerWindow() {
        document
            .getElementById("scannerOverlay")
            .classList.remove("open");

        document.body.style.overflow = "";

        document.getElementById("scannerStatus").textContent = "";
        document.getElementById("snummer").focus();
    }

    function overlayClick(event) {
        if (event.target.id === "scannerOverlay") {
            closeScanner();
        }
    }

    /* QR-CODE VERWERKEN */

    function handleQR(data) {
        let raw = String(data || "").trim();
        let user = "";

        if (raw.includes("login_hint=")) {
            try {
                const url = new URL(raw);
                const parameter = url.searchParams.get("login_hint");

                if (parameter) {
                    user = decodeURIComponent(parameter)
                        .trim()
                        .toLowerCase();
                }
            } catch (error) {
                const match = raw.match(/[?&]login_hint=([^&]+)/i);

                if (match && match[1]) {
                    user = decodeURIComponent(match[1])
                        .trim()
                        .toLowerCase();
                }
            }
        } else {
            user = raw
                .replace(/\s/g, "")
                .toLowerCase();
        }

        user = normaliseerGebruiker(user);

        if (user) {
            document.getElementById("snummer").value = user;
            goToTeams(user);
            return;
        }

        alert("De QR-code werd niet herkend.");
    }

    /* LOGINNAAM NORMALISEREN */

    function normaliseerGebruiker(value) {
        let user = String(value || "")
            .trim()
            .replace(/\s/g, "")
            .toLowerCase();

        if (/^[0-9]{6}$/.test(user)) {
            return "s" + user + "@" + leerlingDomein;
        }

        if (/^s[0-9]{6}$/.test(user)) {
            return user + "@" + leerlingDomein;
        }

        const zonderSMatch = user.match(
            /^([0-9]{6})@leerling\.gvbbooischot\.be$/
        );

        if (zonderSMatch) {
            return (
                "s" +
                zonderSMatch[1] +
                "@" +
                leerlingDomein
            );
        }

        if (
            /^s[0-9]{6}@leerling\.gvbbooischot\.be$/.test(user)
        ) {
            return user;
        }

        return null;
    }

    function getUserFromInput() {
        const input = document.getElementById("snummer");
        const user = normaliseerGebruiker(input.value);

        if (!input.value.trim()) {
            alert("Typ een S-nummer of scan een QR-code.");
            input.focus();
            return null;
        }

        if (!user) {
            alert(
                "Ongeldig S-nummer. Gebruik bijvoorbeeld 123456 of s123456."
            );

            input.focus();
            input.select();

            return null;
        }

        input.value = user;
        return user;
    }

    /* MICROSOFT 365 */

    function goToTeams(user) {
        const url =
            "https://teams.microsoft.com/?login_hint=" +
            encodeURIComponent(user);

        window.location.href = url;
    }

    function openApp(app) {
        const user = getUserFromInput();

        if (!user) {
            return;
        }

        let url = "";

        switch (app) {
            case "teams":
                goToTeams(user);
                return;

            case "word":
                url =
                    "https://www.office.com/launch/word?auth=2&login_hint=" +
                    encodeURIComponent(user);
                break;

            case "ppt":
                url =
                    "https://www.office.com/launch/powerpoint?auth=2&login_hint=" +
                    encodeURIComponent(user);
                break;

            case "onedrive":
                url =
                    "https://www.office.com/launch/onedrive?auth=2&login_hint=" +
                    encodeURIComponent(user);
                break;

            case "outlook":
                url =
                    "https://outlook.office.com/mail/?login_hint=" +
                    encodeURIComponent(user);
                break;

            default:
                return;
        }

        window.location.href = url;
    }

    /* TOOLBOXEN L1 TOT EN MET L6 */

    function openToolbox(key) {
        const links = {
            l1: "https://gvbb.my.canva.site/1e-leerjaar/links",
            l2: "https://gvbb.my.canva.site/2e-leerjaar/links",
            l3: "https://gvbb.my.canva.site/3e-leerjaar/links",
            l4: "https://gvbb.my.canva.site/4e-leerjaar/links",
            l5: "https://gvbb.my.canva.site/5e-leerjaar/links",
            l6: "https://gvbb.my.canva.site/6e-leerjaar/links"
        };

        if (links[key]) {
            window.location.href = links[key];
        }
    }

    /* AFBEELDINGSKNOPPEN */

    function openPictureToolbox(key) {
        /*
