<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVB Booischot Loginhelper</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#d8e3f0;
    margin:0;
    padding:20px;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    background:#f7f9fc;
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,0.10);
}

/* TITEL */

h1{
    text-align:center;
    color:#5f7d30;
    margin-top:0;
    margin-bottom:25px;
    font-size:38px;
}

/* SCAN GEDEELTE */

.scan-section{
    display:flex;
    justify-content:center;
    margin-bottom:30px;
}

.inputblok{
    width:100%;
    max-width:600px;

    background:#eef4fb;
    border:2px solid #84a646;
    border-radius:16px;
    padding:20px;
}

/* INPUT */

input{
    width:100%;
    padding:16px;
    font-size:20px;
    border-radius:12px;
    border:2px solid #84a646;
    margin-bottom:10px;
}

/* KNOPPEN */

.button{
    width:100%;
    padding:14px;
    margin-top:8px;

    border:none;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;

    transition:all .2s;
}

.button:hover{
    transform:translateY(-2px);
    opacity:.92;
}

.scanbtn{
    background:#8eb458;
    font-size:22px;
    padding:18px;
}

/* SCANNER */

#reader{
    margin-top:15px;
    border-radius:12px;
    overflow:hidden;
}

/* ONDERSTE BLOKKEN */

.content-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card h2{
    text-align:center;
    margin-top:0;
    margin-bottom:15px;
    color:#5f7d30;
}

/* OFFICE */

.teams { background:#6264A7; }
.word { background:#2B579A; }
.ppt { background:#D24726; }
.onedrive { background:#0078D4; }
.outlook { background:#0072C6; }

/* TOOLBOX */

.toolbox-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.l1 { background:#4CAF50; }
.l2 { background:#8BC34A; }
.l3 { background:#FFC107; color:black; }
.l4 { background:#FF7043; }
.l5 { background:#9C27B0; }
.l6 { background:#3F51B5; }

.WS { background:#FF9800; }
.TL { background:#E91E63; }

/* MOBIEL */

@media (max-width:900px){

    .content-grid{
        grid-template-columns:1fr;
    }

    h1{
        font-size:30px;
    }

    .scanbtn{
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>🎓 Loginhelper</h1>

    <!-- QR SCANNER BOVENAAN -->

    <div class="scan-section">

        <div class="inputblok">

            <input
                id="snummer"
                placeholder="Typ S-nummer of scan QR-code">

            <button class="button scanbtn" onclick="startScan()">
                📷 Scan QR-code
            </button>

            <div id="reader"></div>

        </div>

    </div>

    <!-- ONDERSTE DEEL -->

    <div class="content-grid">

        <!-- OFFICE -->

        <div class="card">

            <h2>Microsoft 365</h2>

            <button class="button teams" onclick="openApp('teams')">
                Teams
            </button>

            <button class="button word" onclick="openApp('word')">
                Word
            </button>

            <button class="button ppt" onclick="openApp('ppt')">
                PowerPoint
            </button>

            <button class="button onedrive" onclick="openApp('onedrive')">
                OneDrive
            </button>

            <button class="button outlook" onclick="openApp('outlook')">
                Outlook
            </button>

        </div>

        <!-- TOOLBOX -->

        <div class="card">

            <h2>Toolboxen</h2>

            <div class="toolbox-grid">

                <button class="button l1" onclick="openToolbox('l1')">L1</button>
                <button class="button l2" onclick="openToolbox('l2')">L2</button>

                <button class="button l3" onclick="openToolbox('l3')">L3</button>
                <button class="button l4" onclick="openToolbox('l4')">L4</button>

                <button class="button l5" onclick="openToolbox('l5')">L5</button>
                <button class="button l6" onclick="openToolbox('l6')">L6</button>

                <button class="button WS" onclick="openToolbox('WS')">WS</button>
                <button class="button TL" onclick="openToolbox('TL')">TL</button>

            </div>

        </div>

    </div>

</div>

<script>

let scanner = null;

/* FOCUS OP INPUT */

window.onload = function() {
    document.getElementById("snummer").focus();
};

/* QR SCAN */

function startScan() {

    const reader = document.getElementById("reader");

    reader.innerHTML = "📷 Camera starten...";

    if (scanner) {
        scanner.stop().catch(()=>{});
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 220
        },
        (decodedText) => {

            scanner.stop()
            .then(() => reader.innerHTML = "");

            handleQR(decodedText);

        }
    )
    .catch(() => {
        alert("❌ Camera werkt niet. Gebruik HTTPS.");
    });
}

/* QR VERWERKEN */

function handleQR(data) {

    let raw = data.trim();
    let user = "";

    if (raw.includes("login_hint=")) {

        try {

            let url = new URL(raw);
            let param = url.searchParams.get("login_hint");

            if(param){
                user = decodeURIComponent(param)
                    .trim()
                    .toLowerCase();
            }

        } catch {

            let match =
                raw.match(/login_hint=([^&]+)/);

            if(match && match[1]){

                user = decodeURIComponent(match[1])
                    .trim()
                    .toLowerCase();

            }
        }

    } else {

        user = raw
            .replace(/\s/g,"")
            .toLowerCase();

    }

    let match =
        user.match(/^([0-9]{6})@leerling\.gvbbooischot\.be$/);

    if(match){
        user =
            "s" +
            match[1] +
            "@leerling.gvbbooischot.be";
    }

    if(/^[0-9]{6}$/.test(user)){

        user =
            "s" +
            user +
            "@leerling.gvbbooischot.be";

    }

    if(
        /^s[0-9]{6}@leerling\.gvbbooischot\.be$/
        .test(user)
    ){

        goToTeams(user);
        return;

    }

    alert("❌ QR-code niet herkend");
}

/* INPUT */

function getUserFromInput(){

    let s =
        document.getElementById("snummer")
        .value
        .trim()
        .toLowerCase();

    if(!s){

        alert("⚠️ Typ S-nummer of scan QR");

        return null;
    }

    if(s.includes("@")){
        return s;
    }

    if(/^[0-9]{6}$/.test(s)){

        return "s" +
               s +
               "@leerling.gvbbooischot.be";
    }

    alert("⚠️ Ongeldig nummer");

    return null;
}

/* TEAMS */

function goToTeams(user){

    let url =
        "https://teams.microsoft.com/?login_hint=" +
        user;

    window.location.href = url;
}

/* OFFICE */

function openApp(app){

    let user = getUserFromInput();

    if(!user) return;

    let url = "";

    switch(app){

        case "teams":
            goToTeams(user);
            return;

        case "word":
            url =
            "https://www.office.com/launch/word?auth=2&login_hint=" +
            user;
            break;

        case "ppt":
            url =
            "https://www.office.com/launch/powerpoint?auth=2&login_hint=" +
            user;
            break;

        case "onedrive":
            url =
            "https://www.office.com/launch/onedrive?auth=2&login_hint=" +
            user;
            break;

        case "outlook":
            url =
            "https://outlook.office.com/mail/?login_hint=" +
            user;
            break;
    }

    window.location.href = url;
}

/* TOOLBOXEN */

function openToolbox(k){

    const links = {

        l1:"https://gvbb.my.canva.site/1e-leerjaar/links",
        l2:"https://gvbb.my.canva.site/2e-leerjaar/links",
        l3:"https://gvbb.my.canva.site/3e-leerjaar/links",
        l4:"https://gvbb.my.canva.site/4e-leerjaar/links",
        l5:"https://gvbb.my.canva.site/5e-leerjaar/links",
        l6:"https://gvbb.my.canva.site/6e-leerjaar/links",

        WS:"https://sites.google.com/gvbbooischot.be/wijkschool/wijkschool",
        TL:"https://sites.google.com/gvbbooischot.be/ks-ter-laken"

    };

    window.location.href = links[k];
}

</script>

</body>
</html>
``
